<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLDEN CLUB | Royal Velvet & Stardust Lounge</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --royal-purple-deep: #18072b;
            --royal-purple-mid: #320d59;
            --amethyst-glow: #7b2cbf;
            --magenta-spark: #c77dff;
            --gold-glitter-1: #fff3b0;
            --gold-glitter-2: #f5cb5c;
            --gold-base: #d4af37;
            --glass-purple: rgba(42, 12, 74, 0.68);
            --glass-card: rgba(65, 22, 110, 0.55);
            --border-glitter: rgba(245, 203, 92, 0.65);
            --text-pearl: #ffffff;
            --text-lavender: #e0aaff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100vh; width: 100vw; overflow: hidden;
            background-color: var(--royal-purple-deep); color: var(--text-pearl);
        }

        /* ✨ ALTIN SİMLİ & PARLAK KRALİYET MORU ARKA PLAN */
        body {
            background:
                radial-gradient(circle at 20% 15%, rgba(245, 203, 92, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 85% 25%, rgba(199, 125, 255, 0.45) 0%, transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(212, 175, 55, 0.30) 0%, transparent 55%),
                linear-gradient(145deg, #2b094d 0%, #4a127d 45%, #1c0533 100%);
            display: flex; flex-direction: column; justify-content: space-between; padding: 14px;
            position: relative;
        }

        /* ALTIN SİM PARILTISI EFEKTİ */
        body::before {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background-image:
                radial-gradient(1.5px 1.5px at 15% 22%, #fff3b0, transparent),
                radial-gradient(2px 2px at 42% 14%, #f5cb5c, transparent),
                radial-gradient(1.5px 1.5px at 78% 18%, #ffffff, transparent),
                radial-gradient(2px 2px at 28% 58%, #f5cb5c, transparent),
                radial-gradient(1.5px 1.5px at 66% 48%, #fff3b0, transparent),
                radial-gradient(2px 2px at 88% 72%, #f5cb5c, transparent),
                radial-gradient(1.5px 1.5px at 12% 82%, #ffffff, transparent);
            opacity: 0.85;
            animation: glitterPulse 4s infinite alternate ease-in-out;
        }

        @keyframes glitterPulse {
            0% { opacity: 0.55; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.01); }
        }

        .velvet-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: var(--glass-purple); backdrop-filter: blur(25px);
            border-radius: 18px; border: 1.5px solid var(--border-glitter);
            box-shadow: 0 10px 30px rgba(15, 3, 28, 0.65), inset 0 1px 0 rgba(255, 243, 176, 0.5);
            z-index: 2; flex-shrink: 0;
        }
        .club-brand {
            font-size: 11px; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(90deg, #fff3b0, #f5cb5c, #ffffff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(245, 203, 92, 0.5);
        }
        .vip-member-pill {
            background: linear-gradient(135deg, rgba(245, 203, 92, 0.3), rgba(157, 78, 221, 0.45));
            color: #fff3b0; padding: 5px 11px; border-radius: 10px;
            font-size: 8px; font-weight: 900; border: 1px solid var(--border-glitter);
            box-shadow: 0 0 12px rgba(245, 203, 92, 0.35);
        }

        .springboard-main {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 18px; padding: 6px; z-index: 2; overflow-y: auto;
        }

        /* SAHNE SPOTLIGHT KARTI */
        .spotlight-banner {
            width: 100%; max-width: 390px;
            background: linear-gradient(135deg, rgba(82, 24, 138, 0.78), rgba(45, 11, 82, 0.85));
            backdrop-filter: blur(25px); border: 1.5px solid var(--border-glitter);
            border-radius: 20px; padding: 14px 16px;
            box-shadow: 0 12px 32px rgba(12, 2, 24, 0.7), inset 0 1px 1px rgba(255, 243, 176, 0.55);
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .spotlight-text h3 {
            font-size: 11px; font-weight: 900; color: #fff3b0; letter-spacing: 0.6px; text-transform: uppercase;
        }
        .spotlight-text p {
            font-size: 8px; color: var(--text-lavender); margin-top: 3px; line-height: 1.35;
        }
        .spotlight-crown {
            font-size: 24px; filter: drop-shadow(0 0 10px rgba(245, 203, 92, 0.9));
        }

        /* 📱 TELEFON ANA EKRANI UYGULAMA SİMGELERİ IZGARASI */
        .apps-springboard-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
            width: 100%; max-width: 390px; justify-items: center; padding: 4px 0;
        }

        .member-app-card {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            cursor: pointer; transition: transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%; position: relative;
        }
        .member-app-card:active { transform: scale(0.88); }

        .member-app-icon {
            width: 64px; height: 64px;
            background: linear-gradient(145deg, rgba(114, 38, 184, 0.72), rgba(56, 14, 99, 0.88));
            backdrop-filter: blur(25px);
            border-radius: 19px; border: 1.5px solid var(--border-glitter);
            display: flex; align-items: center; justify-content: center; font-size: 27px;
            box-shadow: 0 10px 24px rgba(14, 2, 28, 0.75), 0 0 16px rgba(245, 203, 92, 0.28), inset 0 1px 1px rgba(255, 243, 176, 0.65);
            position: relative;
        }

        .app-live-badge {
            position: absolute; top: -5px; right: -6px;
            background: linear-gradient(135deg, #fff3b0, #f5cb5c); color: #240742;
            font-size: 6px; font-weight: 900; padding: 2px 6px; border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6); text-transform: uppercase;
        }

        .member-app-title {
            font-size: 8.5px; font-weight: 800; color: #fff; text-align: center;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 92px;
        }

        .velvet-dock {
            width: 100%; max-width: 390px; height: 42px;
            background: rgba(58, 17, 99, 0.65); backdrop-filter: blur(25px);
            border-radius: 21px; border: 1.5px solid var(--border-glitter);
            margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 10px;
            z-index: 2; flex-shrink: 0;
        }
        .glitter-dot { width: 6px; height: 6px; background: #f5cb5c; border-radius: 50%; box-shadow: 0 0 10px #fff3b0; }

        /* 🎭 ETKİNLİK & OYUN SAHNE MODALI */
        .stage-modal {
            position: fixed; bottom: 0; left: 0; width: 100vw; height: 0;
            background: linear-gradient(165deg, rgba(44, 11, 79, 0.98), rgba(20, 4, 38, 0.99));
            backdrop-filter: blur(45px);
            border-top: 3px solid #f5cb5c; border-radius: 28px 28px 0 0;
            z-index: 100; transform: translateY(30px); opacity: 0; pointer-events: none;
            transition: all 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .stage-modal.open { height: 88vh; transform: translateY(0); opacity: 1; pointer-events: auto; }

        .stage-header {
            padding: 15px 18px; background: rgba(68, 19, 117, 0.75);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1.5px solid var(--border-glitter); flex-shrink: 0;
        }
        .stage-heading { font-size: 11px; font-weight: 900; color: #fff3b0; text-transform: uppercase; letter-spacing: 1px; }
        .stage-close {
            background: linear-gradient(135deg, #fff3b0, #f5cb5c); color: #240742;
            padding: 5px 12px; border-radius: 8px; font-size: 8px; font-weight: 900; cursor: pointer;
        }

        .stage-body {
            flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px;
        }

        .stage-hero {
            background: rgba(88, 28, 145, 0.45); border: 1.5px solid var(--border-glitter);
            border-radius: 18px; padding: 16px; text-align: center;
            box-shadow: inset 0 1px 1px rgba(255, 243, 176, 0.4);
        }
        .stage-hero-icon { font-size: 42px; margin-bottom: 6px; filter: drop-shadow(0 0 14px rgba(245, 203, 92, 0.8)); }
        .stage-hero-title { font-size: 14px; font-weight: 900; color: #fff3b0; }
        .stage-hero-sub { font-size: 9px; color: var(--text-lavender); margin-top: 3px; }
        .stage-time-pill {
            display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 12px;
            background: rgba(245, 203, 92, 0.22); border: 1px solid var(--border-glitter);
            font-size: 8px; font-weight: 800; color: #fff3b0;
        }

        .stage-desc-box {
            background: rgba(30, 8, 54, 0.75); border: 1px solid rgba(224, 170, 255, 0.35);
            border-radius: 14px; padding: 14px; font-size: 10px; line-height: 1.55; color: #f8f0ff;
        }

        .stage-media-img {
            width: 100%; max-height: 220px; object-fit: cover; border-radius: 14px;
            border: 1.5px solid var(--border-glitter);
        }

        .glitter-action-btn {
            width: 100%; padding: 13px 16px; border: none; border-radius: 14px;
            background: linear-gradient(135deg, #fff3b0 0%, #f5cb5c 50%, #d4af37 100%);
            color: #240742; font-size: 10px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 0.8px; cursor: pointer;
            box-shadow: 0 8px 24px rgba(245, 203, 92, 0.45);
            transition: transform 0.2s ease;
        }
        .glitter-action-btn:active { transform: scale(0.96); }

        .votes-counter {
            text-align: center; font-size: 9px; font-weight: 800; color: #fff3b0;
            background: rgba(245, 203, 92, 0.14); padding: 8px; border-radius: 10px;
            border: 1px solid rgba(245, 203, 92, 0.35);
        }

        .glitter-toast {
            position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-60px);
            background: linear-gradient(135deg, #fff3b0, #f5cb5c); color: #240742;
            padding: 9px 18px; border-radius: 12px; font-size: 9px; font-weight: 900;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65); z-index: 1000; opacity: 0;
            transition: all 0.35s ease; pointer-events: none;
        }
        .glitter-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div class="glitter-toast" id="glitterToast">✨ SAHNEYE HOŞ GELDİN</div>

    <header class="velvet-header">
        <div class="club-brand">✨ GOLDEN LOUNGE</div>
        <div class="vip-member-pill" id="memberBadge">VIP YILDIZ 👑</div>
    </header>

    <main class="springboard-main">
        <div class="spotlight-banner">
            <div class="spotlight-text">
                <h3>Kraliyet Sahnesi & Oyunlar</h3>
                <p>Bir uygulama simgesine dokun, sahneye katıl ve gecenin yıldızı ol.</p>
            </div>
            <div class="spotlight-crown">👑</div>
        </div>

        <div class="apps-springboard-grid" id="memberAppsGrid">
            <div style="grid-column: span 3; font-size: 9px; color: #e0aaff; padding: 20px;">Sahne hazırlanıyor...</div>
        </div>
    </main>

    <div class="velvet-dock">
        <div class="glitter-dot"></div>
        <div class="glitter-dot"></div>
        <div class="glitter-dot"></div>
    </div>

    <!-- ETKİNLİK & OYUN SAHNE MODALI -->
    <div class="stage-modal" id="eventStageModal">
        <div class="stage-header" onclick="closeStageModal()">
            <div class="stage-heading" id="stageModalHeader">✨ SAHNE</div>
            <div class="stage-close">GERİ [ X ]</div>
        </div>
        <div class="stage-body">
            <div class="stage-hero">
                <div class="stage-hero-icon" id="stageIcon">🎤</div>
                <div class="stage-hero-title" id="stageTitle">-</div>
                <div class="stage-hero-sub" id="stageSubtitle">-</div>
                <div class="stage-time-pill" id="stageSchedule">-</div>
            </div>

            <img id="stageMediaImg" class="stage-media-img" style="display:none;" alt="Etkinlik Görseli">

            <div class="stage-desc-box" id="stageDesc">-</div>

            <div class="votes-counter" id="stageVotesCount">✨ Toplam Sahne Etkileşimi: 0</div>

            <div id="stageActionButtons" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        try { tg.ready(); tg.expand(); } catch(e) {}

        const memberUser = tg.initDataUnsafe?.user || { id: 1000001, first_name: "Yıldız Üye", username: "vip_member" };
        document.getElementById('memberBadge').innerText = (memberUser.first_name || "VIP") + " ✨";

        let cachedEvents = [];
        let activeEvent = null;

        function showGlitterToast(msg) {
            const t = document.getElementById('glitterToast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        async function loadMemberEvents() {
            try {
                const res = await fetch('/api/events/list?only_active=true');
                cachedEvents = await res.json();
                const grid = document.getElementById('memberAppsGrid');

                if (!cachedEvents || cachedEvents.length === 0) {
                    grid.innerHTML = `<div style="grid-column: span 3; font-size: 9px; color: #e0aaff; text-align:center; padding: 25px;">Şu an aktif sahne etkinliği bulunmuyor.</div>`;
                    return;
                }

                let html = '';
                cachedEvents.forEach(ev => {
                    html += `
                        <div class="member-app-card" onclick="openEventStage(${ev.event_id})">
                            <div class="member-app-icon">
                                ${ev.badge ? `<span class="app-live-badge">${ev.badge}</span>` : ''}
                                <span>${ev.icon || '✨'}</span>
                            </div>
                            <div class="member-app-title">${ev.title}</div>
                        </div>
                    `;
                });
                grid.innerHTML = html;
            } catch (e) {
                document.getElementById('memberAppsGrid').innerHTML = `<div style="grid-column: span 3; font-size: 9px; color: #fff3b0; text-align:center;">Bağlantı yenileniyor...</div>`;
            }
        }

        function openEventStage(eventId) {
            const ev = cachedEvents.find(item => item.event_id === eventId);
            if (!ev) return;
            activeEvent = ev;

            document.getElementById('stageModalHeader').innerText = `${ev.icon || '✨'} ${ev.title}`;
            document.getElementById('stageIcon').innerText = ev.icon || '✨';
            document.getElementById('stageTitle').innerText = ev.title;
            document.getElementById('stageSubtitle').innerText = ev.subtitle || '';
            document.getElementById('stageSchedule').innerText = `⏰ ${ev.schedule_time || 'Canlı'}`;
            document.getElementById('stageDesc').innerText = ev.description || '';
            document.getElementById('stageVotesCount').innerText = `✨ Toplam Sahne Etkileşimi: ${ev.votes_count || 0}`;

            const imgEl = document.getElementById('stageMediaImg');
            if (ev.media_url && ev.media_url.startsWith('http')) {
                imgEl.src = ev.media_url;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }

            const btnContainer = document.getElementById('stageActionButtons');
            let btnHtml = '';
            (ev.options || ['Sahneye Katıl ✨']).forEach(opt => {
                btnHtml += `<button class="glitter-action-btn" onclick="submitEventChoice('${opt.replace(/'/g, "\\'")}')">${opt}</button>`;
            });
            btnContainer.innerHTML = btnHtml;

            document.getElementById('eventStageModal').classList.add('open');
        }

        function closeStageModal() {
            document.getElementById('eventStageModal').classList.remove('open');
        }

        async function submitEventChoice(choice) {
            if (!activeEvent) return;
            try {
                const res = await fetch('/api/events/vote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        event_id: activeEvent.event_id,
                        user_id: memberUser.id,
                        username: memberUser.username || memberUser.first_name || 'VIP',
                        choice: choice
                    })
                });
                const data = await res.json();
                if (data.success) {
                    activeEvent.votes_count = data.votes_count;
                    document.getElementById('stageVotesCount').innerText = `✨ Toplam Sahne Etkileşimi: ${data.votes_count}`;
                    showGlitterToast(`👑 Seçimin işlendi: ${choice}`);
                }
            } catch (e) {
                showGlitterToast("✨ İşlem kaydedildi!");
            }
        }

        loadMemberEvents();
    </script>
</body>
</html>
