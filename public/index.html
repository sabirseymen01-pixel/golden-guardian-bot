<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Staff | Yönetim Paneli</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: rgba(25, 29, 38, 0.75);
            --border-color: rgba(212, 175, 55, 0.2);
            --accent-gold: #d4af37;
            --text-main: #f0f2f5;
            --text-muted: #9aa0a6;
            --danger: #ff4d4d;
            --success: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 40px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area h1 {
            font-size: 20px;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .logo-area p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .admin-badge {
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent-gold);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        .control-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .control-status {
            font-size: 14px;
            font-weight: 700;
            color: var(--success);
        }

        .lock-btn {
            background: rgba(255, 77, 77, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .stat-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .staff-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 17, 21, 0.6);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
        }

        .staff-actions {
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-toggle-on { background: rgba(46, 204, 113, 0.2); color: var(--success); border: 1px solid var(--success); }
        .btn-toggle-off { background: rgba(255, 77, 77, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .btn-delete { background: rgba(150, 150, 150, 0.2); color: #aaa; }

        .logs-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .log-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .log-type {
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }

        .type-ban, .type-security_ban { background: rgba(255, 77, 77, 0.2); color: var(--danger); }
        .type-admin_report { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }
        .type-warn { background: rgba(230, 126, 34, 0.2); color: #e67e22; }
        .type-default { background: rgba(46, 204, 113, 0.2); color: var(--success); }

        .log-time { color: var(--text-muted); }
        .log-details { font-size: 13px; color: var(--text-main); word-break: break-word; }
        .log-user { font-size: 11px; color: var(--text-muted); }
        .loading { text-align: center; color: var(--text-muted); padding: 20px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <h1>Golden Staff</h1>
            <p>Gelişmiş Moderasyon & Log Paneli</p>
        </div>
        <div class="admin-badge" id="userRole">Yönetici 🛡️</div>
    </div>

    <!-- KURUCU ÖZEL: STAFF YÖNETİM PANELİ (Sadece Kurucu Görür) -->
    <div id="founderPanel" style="display: none;">
        <div class="section-title">👑 Kurucu Staff & Ban Yetki Yönetimi</div>
        <div class="control-card">
            <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                <input type="text" id="newStaffInput" placeholder="User ID veya @kullaniciadi" style="flex: 1; background: #151922; border: 1px solid var(--border-color); padding: 8px; border-radius: 8px; color: white; font-size: 12px;">
                <input type="text" id="newStaffName" placeholder="Ad / Nick" style="width: 90px; background: #151922; border: 1px solid var(--border-color); padding: 8px; border-radius: 8px; color: white; font-size: 12px;">
                <button onclick="addStaff()" style="background: var(--accent-gold); color: black; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 11px; cursor: pointer;">Ekle</button>
            </div>
            <div id="staffListContainer" style="display: flex; flex-direction: column; gap: 8px;">
                <div class="loading">Staff listesi yükleniyor...</div>
            </div>
        </div>
    </div>

    <!-- ACİL DURUM / BAN YETKİ KONTROL KARTI -->
    <div class="control-card">
        <div class="control-row">
            <div>
                <div class="control-title">Genel Bot Ban Şalteri</div>
                <div id="lockStatusText" class="control-status">Normal (Aktif ✅)</div>
            </div>
            <button id="lockdownBtn" class="lock-btn" onclick="toggleLockdown()">Acil Durum Kilidi 🔒</button>
        </div>
    </div>

    <!-- İstatistikler -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">Toplam Olay</div>
            <div class="stat-value" id="totalActions">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Güvenlik Banı</div>
            <div class="stat-value" id="totalBans">-</div>
        </div>
    </div>

    <!-- Canlı Loglar -->
    <div class="section-title">📊 Canlı Sistem Logları</div>
    <div class="logs-container" id="logsList">
        <div class="loading">Loglar yükleniyor...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        
        if (!user) {
            showAccessDenied("Telegram oturumu bulunamadı. Lütfen bot üzerinden tekrar açın.");
            throw new Error("Oturum yok.");
        }

        let isFounder = false;

        async function verifyAccess() {
            try {
                const res = await fetch('/api/verify-admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id })
                });
                
                const data = await res.json();
                
                if (!data.authorized) {
                    showAccessDenied("Bu panele yalnızca Golden Staff üyeleri erişebilir.");
                    return;
                }

                isFounder = !!data.is_founder;
                document.getElementById('userRole').innerText = (user.first_name || 'Yönetici') + (isFounder ? " 👑" : " 🛡️");

                if (isFounder) {
                    const founderPanel = document.getElementById('founderPanel');
                    if (founderPanel) founderPanel.style.display = 'block';
                    loadStaffList();
                }

                checkLockStatus();
                fetchData();
                setInterval(() => {
                    checkLockStatus();
                    fetchData();
                }, 5000);

            } catch (err) {
                console.error("Yetki doğrulama hatası:", err);
                showAccessDenied("Sunucu yetki doğrulaması yapılamadı.");
            }
        }

        function showAccessDenied(message) {
            document.body.innerHTML = `
                <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:90vh; background:#0f1115; color:#ff4d4d; text-align:center; padding:20px; font-family:sans-serif;">
                    <h2 style="margin-bottom: 10px;">⛔ Yetkisiz Erişim!</h2>
                    <p style="color:#9aa0a6; font-size:14px;">${message}</p>
                    <p style="color:#d4af37; font-size:12px; margin-top:15px;">Telegram ID'niz: ${user ? user.id : 'Bilinmiyor'}</p>
                </div>
            `;
        }

        async function loadStaffList() {
            if (!isFounder) return;
            try {
                const res = await fetch('/api/staff/list', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id })
                });
                const staffList = await res.json();
                const container = document.getElementById('staffListContainer');

                if (staffList.length === 0) {
                    container.innerHTML = '<div style="font-size:12px; color:var(--text-muted); text-align:center;">Kayıtlı staff bulunmuyor.</div>';
                    return;
                }

                container.innerHTML = '';
                staffList.forEach(s => {
                    const item = document.createElement('div');
                    item.className = 'staff-item';
                    item.innerHTML = `
                        <div>
                            <strong>${s.full_name || 'Staff'}</strong><br>
                            <span style="font-size:11px; color:var(--text-muted);">ID: ${s.user_id} | @${s.username || 'yok'}</span>
                        </div>
                        <div class="staff-actions">
                            <button class="btn-sm ${s.can_ban === 1 ? 'btn-toggle-on' : 'btn-toggle-off'}" onclick="toggleStaffBan(${s.user_id}, ${s.can_ban})">
                                ${s.can_ban === 1 ? 'Ban: Açık ✅' : 'Ban: Kapalı ❌'}
                            </button>
                            <button class="btn-sm btn-delete" onclick="removeStaff(${s.user_id})">Sil</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (err) {
                console.error("Staff listesi yüklenemedi:", err);
            }
        }

        async function addStaff() {
            const staffInput = document.getElementById('newStaffInput').value.trim();
            const newName = document.getElementById('newStaffName').value.trim() || 'Staff';
            
            if (!staffInput) {
                alert("Lütfen Telegram User ID veya @kullanıcıadı girin!");
                return;
            }

            try {
                const res = await fetch('/api/staff/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id, staff_input: staffInput, full_name: newName })
                });
                const result = await res.json();
                if (result.success) {
                    document.getElementById('newStaffInput').value = '';
                    document.getElementById('newStaffName').value = '';
                    loadStaffList();
                } else {
                    alert("Ekleme başarısız: " + (result.error || "Bilinmeyen hata"));
                }
            } catch (err) {
                alert("Sunucu hatası!");
            }
        }

        async function toggleStaffBan(targetId, currentStatus) {
            const newStatus = currentStatus === 1 ? 0 : 1;
            try {
                const res = await fetch('/api/staff/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id, target_id: targetId, status: newStatus })
                });
                const result = await res.json();
                if (result.success) {
                    loadStaffList();
                }
            } catch (err) {
                alert("Yetki değiştirilemedi!");
            }
        }

        async function removeStaff(targetId) {
            if (!confirm("Bu staff'ı listeden silmek istediğine emin misin?")) return;
            try {
                const res = await fetch('/api/staff/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id, target_id: targetId })
                });
                const result = await res.json();
                if (result.success) {
                    loadStaffList();
                }
            } catch (err) {
                alert("Silme başarısız!");
            }
        }

        async function checkLockStatus() {
            try {
                const res = await fetch('/api/lock-status');
                const data = await res.json();
                const statusEl = document.getElementById('lockStatusText');
                const btnEl = document.getElementById('lockdownBtn');

                if (data.lockdown) {
                    statusEl.innerText = "KİLİTLİ (Banlar Durduruldu 🛑)";
                    statusEl.style.color = "var(--danger)";
                    btnEl.innerText = "Kilidi Kaldır ✅";
                } else {
                    statusEl.innerText = "Normal (Aktif ✅)";
                    statusEl.style.color = "var(--success)";
                    btnEl.innerText = "Acil Durum Kilidi 🔒";
                }
            } catch (err) {
                console.error("Kilit durumu alınamadı:", err);
            }
        }

        async function toggleLockdown() {
            try {
                const res = await fetch('/api/toggle-lockdown', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user.id })
                });
                const result = await res.json();
                if (result.success) {
                    checkLockStatus();
                } else {
                    alert("Yetkiniz yok!");
                }
            } catch (err) {
                alert("Sunucuyla iletişim kurulamadı!");
            }
        }

        async function fetchData() {
            try {
                const statsRes = await fetch('/api/stats');
                const stats = await statsRes.json();
                document.getElementById('totalActions').innerText = stats.total_actions || 0;
                
                const breakdown = stats.action_breakdown || {};
                const banCount = (breakdown['BAN'] || 0) + (breakdown['SECURITY_BAN'] || 0) + (breakdown['WARN_BAN'] || 0);
                document.getElementById('totalBans').innerText = banCount;

                const logsRes = await fetch('/api/logs');
                const logs = await logsRes.json();
                const logsContainer = document.getElementById('logsList');

                if (logs.length === 0) {
                    logsContainer.innerHTML = '<div class="loading">Henüz kaydedilmiş bir hareket yok.</div>';
                    return;
                }

                logsContainer.innerHTML = '';
                logs.forEach(log => {
                    let typeClass = 'type-default';
                    if (log.action_type.includes('BAN')) typeClass = 'type-ban';
                    else if (log.action_type === 'ADMIN_REPORT') typeClass = 'type-admin_report';
                    else if (log.action_type.includes('WARN')) typeClass = 'type-warn';

                    const item = document.createElement('div');
                    item.className = 'log-item';
                    item.innerHTML = `
                        <div class="log-header">
                            <span class="log-type ${typeClass}">${log.action_type}</span>
                            <span class="log-time">${log.timestamp}</span>
                        </div>
                        <div class="log-details">${escapeHtml(log.details)}</div>
                        <div class="log-user">Kullanıcı ID: ${log.user_id} | @${escapeHtml(log.username || 'Bilinmiyor')}</div>
                    `;
                    logsContainer.appendChild(item);
                });

            } catch (err) {
                console.error("Veri çekme hatası:", err);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        verifyAccess();
    </script>
</body>
</html>
