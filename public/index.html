<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Katya | 3D Perspective Cockpit</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --space-black: #020100;
            --hud-gold: #d4af37;
            --gold-glow: #f8ecbe;
            --danger-red: #ff3333;
            --success-green: #2ecc71;
            --glass-panel: rgba(10, 8, 4, 0.90);
            --border-gold: rgba(212, 175, 55, 0.65);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100vh; width: 100vw; overflow: hidden; background-color: var(--space-black);
            perspective: 1200px;
        }

        body {
            background: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.25) 0%, rgba(2, 1, 0, 0.98) 85%);
            color: #fff; display: flex; flex-direction: column; justify-content: space-between; padding: 4px;
        }

        /* 🌌 Arka Plan 3D Uzay Kokpiti (Three.js WebGL) */
        #webgl-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none;
        }

        /* Üst Komuta Header */
        .hud-header {
            position: relative; z-index: 10; display: flex; justify-content: space-between; align-items: center;
            padding: 4px 8px; background: rgba(8, 6, 3, 0.85); backdrop-filter: blur(15px); border-radius: 6px;
            border: 1.5px solid var(--border-gold); box-shadow: 0 4px 15px rgba(0,0,0,0.85), inset 0 0 10px rgba(212,175,55,0.2);
        }
        .logo { font-size: 9px; color: var(--gold-glow); font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px var(--hud-gold); }
        .badge { background: rgba(212,175,55,0.25); color: var(--gold-glow); padding: 2px 6px; border-radius: 4px; font-size: 7px; border: 1px solid var(--hud-gold); font-weight: 900; }

        /* 🪐 MERKEZİ DÖNEN RADAR KONSOLU */
        .radar-deck {
            position: relative; z-index: 10; width: 100%; height: 90px; display: flex; align-items: center; justify-content: center;
            background: rgba(4, 3, 1, 0.85); border-radius: 50%; border: 1.5px solid var(--border-gold);
            box-shadow: 0 0 25px rgba(212,175,55,0.25), inset 0 0 15px rgba(212,175,55,0.18);
            margin: 2px auto; max-width: 250px;
        }
        
        .katya-core {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle, #f8ecbe 0%, #d4af37 60%, #3a2e0f 100%);
            border: 2px solid var(--gold-glow); display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 0 12px var(--hud-gold); z-index: 15; cursor: pointer;
        }
        .core-icon { font-size: 12px; }
        .core-text { font-size: 5px; font-weight: 900; color: #000; text-transform: uppercase; }

        .orbit-ring {
            position: absolute; width: 100%; height: 100%; left: 0; top: 0; animation: orbitSpin 30s linear infinite;
        }
        @keyframes orbitSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .orbit-node {
            position: absolute; left: 50%; top: 50%; display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 12;
        }
        .orbit-node-inner { display: flex; flex-direction: column; align-items: center; animation: counterSpin 30s linear infinite; }
        @keyframes counterSpin { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        .orbit-avatar {
            width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--hud-gold);
            background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 6px var(--hud-gold);
        }
        .orbit-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .orbit-label { font-size: 5px; color: #d4c8b0; background: rgba(0,0,0,0.9); padding: 1px 3px; border-radius: 3px; margin-top: 1px; max-width: 45px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid rgba(212,175,55,0.3); }

        /* 🪞 3D PERSPEKTİFTE AÇILI SÜZÜLEN HOLOGRAFİK PENCERELER */
        .cockpit-grid {
            position: relative; z-index: 10; flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; margin-top: 2px; overflow: hidden;
            transform: rotateX(6deg) perspective(800px); /* Derinlik ve Açı Efekti */
        }

        .hud-panel {
            background: var(--glass-panel); backdrop-filter: blur(20px);
            border: 1.5px solid var(--border-gold); border-radius: 8px; padding: 5px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.95), inset 0 0 12px rgba(212, 175, 55, 0.15);
            position: relative; display: flex; flex-direction: column; overflow: hidden;
            transition: transform 0.3s ease;
        }
        .hud-panel:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 35px rgba(212,175,55,0.3), inset 0 0 18px rgba(212,175,55,0.3);
        }
        .hud-panel::before {
            content: ""; position: absolute; top: -1px; left: -1px; width: 4px; height: 4px;
            border-top: 1.5px solid var(--gold-glow); border-left: 1.5px solid var(--gold-glow);
        }
        .hud-panel::after {
            content: ""; position: absolute; bottom: -1px; right: -1px; width: 4px; height: 4px;
            border-bottom: 1.5px solid var(--gold-glow); border-right: 1.5px solid var(--gold-glow);
        }

        .panel-title { font-size: 7px; font-weight: 900; color: var(--gold-glow); border-bottom: 1px solid rgba(212,175,55,0.35); padding-bottom: 2px; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
        .panel-body { flex: 1; overflow-y: auto; font-size: 7px; display: flex; flex-direction: column; gap: 3px; scrollbar-width: none; }
        .panel-body::-webkit-scrollbar { display: none; }

        input, select, textarea {
            width: 100%; background: rgba(0,0,0,0.88); border: 1px solid rgba(212,175,55,0.45);
            border-radius: 3px; padding: 3px; color: #fff; font-size: 7px; outline: none; margin-bottom: 2px;
        }
        input:focus { border-color: var(--gold-glow); box-shadow: 0 0 5px var(--gold-glow); }

        .cyber-btn {
            width: 100%; background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%); color: #000;
            border: none; padding: 4px; border-radius: 3px; font-weight: 900; font-size: 6px; cursor: pointer; text-transform: uppercase;
        }
        .cyber-btn:active { transform: scale(0.97); }

        .item-row { background: rgba(0,0,0,0.65); border: 1px solid rgba(212,175,55,0.25); padding: 3px; border-radius: 3px; display: flex; justify-content: space-between; align-items: center; font-size: 6px; }
        .log-box { background: rgba(0,0,0,0.75); border: 1px solid rgba(212,175,55,0.3); padding: 3px; border-radius: 3px; font-size: 6px; color: #d4c8b0; }

        /* Katya AI Terminal Paneli */
        .katya-box { display: flex; flex-direction: column; height: 100%; background: rgba(0,0,0,0.92); border-radius: 3px; overflow: hidden; border: 1px solid rgba(212,175,55,0.3); }
        .katya-screen { flex: 1; padding: 2px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; font-size: 6px; }
        .j-msg { max-width: 90%; padding: 2px 4px; border-radius: 3px; line-height: 1.2; }
        .j-msg.ai { background: rgba(212,175,55,0.18); color: var(--gold-glow); border: 1px solid rgba(212,175,55,0.45); align-self: flex-start; }
        .j-msg.user { background: rgba(255,255,255,0.1); color: #fff; align-self: flex-end; }
        .j-input-bar { display: flex; padding: 2px; background: #000; border-top: 1px solid var(--hud-gold); gap: 2px; }
        .j-input-bar input { margin-bottom: 0; }
    </style>
</head>
<body>

    <!-- 🌌 Three.js 3D Arka Plan Motoru -->
    <div id="webgl-container"></div>

    <!-- Üst Header -->
    <div class="hud-header">
        <div class="logo">⚜️ KATYA 3D PERSPECTIVE HUD</div>
        <div class="badge" id="userRole">Kraljica 👑</div>
    </div>

    <!-- 🪐 Merkez Dönen Yörünge Halkası -->
    <div class="radar-deck" id="radarContainer">
        <div class="katya-core" onclick="selectGroupNode(0)" title="Genel Hub">
            <div class="core-icon">⚜️</div>
            <div class="core-text">Katya</div>
        </div>
        <div class="orbit-ring" id="radarNodesRing"></div>
    </div>

    <!-- 🪞 3D Açılı Süzülen Çoklu Holografik Pencere Izgarası -->
    <div class="cockpit-grid">
        
        <!-- PENCERE 1: TELEMETRİ -->
        <div class="hud-panel">
            <div class="panel-title">📊 Telemetri</div>
            <div class="panel-body">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 3px;">
                    <div style="background: rgba(0,0,0,0.6); padding: 4px; border-radius: 3px; border: 1px solid rgba(212,175,55,0.3);">
                        <div style="font-size: 5px; color: #d4c8b0;">İŞLEM</div>
                        <div id="totalActions" style="font-size: 10px; font-weight: 900; color: var(--gold-glow);">-</div>
                    </div>
                    <div style="background: rgba(0,0,0,0.6); padding: 4px; border-radius: 3px; border: 1px solid rgba(212,175,55,0.3);">
                        <div style="font-size: 5px; color: #d4c8b0;">BLOKE</div>
                        <div id="totalBans" style="font-size: 10px; font-weight: 900; color: var(--danger-red);">-</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PENCERE 2: STAFF MATRİSİ -->
        <div class="hud-panel">
            <div class="panel-title">👑 Staff Matrisi</div>
            <div class="panel-body">
                <input type="text" id="staffInput" placeholder="@username/ID">
                <input type="text" id="staffName" placeholder="Rozet Ünvanı">
                <button class="cyber-btn" onclick="addStaff()">Mühürle</button>
                <div id="staffListContainer" style="margin-top: 1px;"><div style="font-size:5px; color:#d4c8b0;">Yükleniyor...</div></div>
            </div>
        </div>

        <!-- PENCERE 3: TAKTİKSEL & LOGLAR -->
        <div class="hud-panel">
            <div class="panel-title">⚡ Taktiksel & Log</div>
            <div class="panel-body">
                <input type="text" id="memberTargetInput" placeholder="Hedef ID/@username">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-bottom: 2px;">
                    <button class="cyber-btn" style="background: var(--danger-red); color:#fff; padding:2px;" onclick="memberAction('ban')">Banla 🚫</button>
                    <button class="cyber-btn" style="background: var(--success-green); color:#fff; padding:2px;" onclick="memberAction('unban')">Aç ✅</button>
                </div>
                <div id="generalLogsContainer"><div style="font-size:5px; color:#d4c8b0;">Loglar akıyor...</div></div>
            </div>
        </div>

        <!-- PENCERE 4: KATYA AI -->
        <div class="hud-panel">
            <div class="panel-title">🤖 Katya AI Asistan</div>
            <div class="panel-body" style="padding:0;">
                <div class="katya-box">
                    <div class="katya-screen" id="katyaScreen">
                        <div class="j-msg ai">⚜️ 3D Kokpit panelleri aktif, Kraljica.</div>
                    </div>
                    <div class="j-input-bar">
                        <input type="text" id="katyaInput" placeholder="Komut ver..." onkeypress="handleKatyaKey(event)">
                        <button class="cyber-btn" style="width: 30px; padding: 0; font-size: 5px;" onclick="sendKatyaCommand()">İlet</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 🌌 Three.js 3D Uzay Kokpiti Arka Plan Motoru
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('webgl-container').appendChild(renderer.domElement);

        const particlesCount = 350;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 14;
            positions[i + 1] = (Math.random() - 0.5) * 14;
            positions[i + 2] = (Math.random() - 0.5) * 14;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ color: 0xd4af37, size: 0.035, transparent: true, opacity: 0.8 });
        const starField = new THREE.Points(geometry, material);
        scene.add(starField);
        camera.position.z = 4;

        function animate3D() {
            requestAnimationFrame(animate3D);
            starField.rotation.y += 0.0008;
            starField.rotation.x += 0.0004;
            renderer.render(scene, camera);
        }
        animate3D();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // TELEGRAM & API KONTROL MİMARİSİ
        const tg = window.Telegram.WebApp;
        try { tg.ready(); tg.expand(); } catch(e) {}
        
        let user = tg.initDataUnsafe?.user || { id: 8245373459, first_name: "Breskavica", username: "breskavica" };
        let selectedChatId = 0;

        async function verifyAccess() {
            try {
                const res = await fetch('/api/verify-admin', { 
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ user_id: user.id }) 
                });
                const data = await res.json();
                if (!data.authorized) { document.body.innerHTML = `<div style="text-align:center; padding:50px; color:red;"><h2>⛔ YETKİSİZ ERİŞİM!</h2></div>`; return; }
                const isFounder = String(user.id) === "8245373459" || data.is_founder;
                document.getElementById('userRole').innerText = (user.first_name || 'Admin') + (isFounder ? " Kraljica 👑" : " 🛡️");
                await loadGroups(); 
                await loadData(); 
                setInterval(loadData, 5000);
            } catch (e) {}
        }

        async function loadGroups() {
            try {
                const res = await fetch('/api/groups');
                const groups = await res.json();
                const ringContainer = document.getElementById('radarNodesRing');

                if (ringContainer) {
                    let html = '';
                    const radius = 42; 
                    groups.forEach((g, index) => {
                        const angle = (index / groups.length) * 2 * Math.PI;
                        const x = Math.cos(angle) * radius;
                        const y = Math.sin(angle) * radius;
                        const isActive = selectedChatId == g.chat_id;

                        let avatar = `<span style="font-size:10px;">🛡️</span>`;
                        if (g.photo_url) {
                            // CORS ve Token patlamasını önleyen Backend Proxy Köprüsü
                            const proxyUrl = `/api/proxy-image?url=${encodeURIComponent(g.photo_url)}`;
                            avatar = `<img src="${proxyUrl}" onerror="this.parentElement.innerHTML='🛡️'">`;
                        }

                        html += `
                            <div class="orbit-node ${isActive ? 'active' : ''}" 
                                 style="transform: translate(-50%, -50%) translate(${x}px, ${y}px);" 
                                 onclick="selectGroupNode(${g.chat_id})">
                                <div class="orbit-node-inner">
                                    <div class="orbit-avatar">${avatar}</div>
                                    <div class="orbit-label">${g.title || 'Grup'}</div>
                                </div>
                            </div>
                        `;
                    });
                    ringContainer.innerHTML = html;
                }
            } catch (e) {}
        }

        function selectGroupNode(chatId) {
            selectedChatId = chatId;
            loadGroups();
            loadData();
        }

        async function loadData() {
            try {
                const statsRes = await fetch('/api/stats');
                const stats = await statsRes.json();
                document.getElementById('totalActions').innerText = stats.total_actions || 0;
                const bd = stats.action_breakdown || {};
                document.getElementById('totalBans').innerText = (bd['BAN'] || 0) + (bd['AUTO_BAN'] || 0);

                const genRes = await fetch('/api/logs?filter=general&limit=15');
                const genLogs = await genRes.json();
                const genC = document.getElementById('generalLogsContainer');
                genC.innerHTML = genLogs.length === 0 ? '<div style="font-size:5px; color:#d4c8b0;">Log yok.</div>' : '';
                genLogs.forEach(l => {
                    genC.innerHTML += `<div class="log-box"><b>${l.action_type}</b>: @${l.username || l.target_id}</div>`;
                });

                const staffRes = await fetch('/api/staff/list', { 
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ user_id: user.id, chat_id: selectedChatId }) 
                });
                const staffs = await staffRes.json();
                const staffC = document.getElementById('staffListContainer');
                staffC.innerHTML = staffs.length === 0 ? '<div style="font-size:5px; color:#d4c8b0;">Yetkili yok.</div>' : '';
                
                staffs.forEach(s => {
                    const sName = s.full_name || s.name || s.first_name || "Muhafız";
                    const targetId = s.user_id || s.id || 0;
                    staffC.innerHTML += `
                        <div class="item-row">
                            <span><b>${sName}</b></span>
                            <button onclick="removeStaff(${targetId})" style="background:#444; color:#fff; border:none; padding:1px 2px; font-size:5px; cursor:pointer;">Sil</button>
                        </div>
                    `;
                });
            } catch (e) {}
        }

        async function addStaff() {
            const input = document.getElementById('staffInput').value.trim();
            const name = document.getElementById('staffName').value.trim() || '👑 Muhafız';
            if (!input) return alert("Değer girin!");
            await fetch('/api/staff/add', { 
                method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ user_id: user.id, chat_id: selectedChatId, staff_input: input, full_name: name }) 
            });
            document.getElementById('staffInput').value = ''; 
            document.getElementById('staffName').value = ''; 
            loadData(); 
            alert("✅ Mühürlendi!");
        }

        async function removeStaff(targetId) {
            if (!confirm("Silinsin mi?")) return;
            await fetch('/api/staff/remove', { 
                method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ user_id: user.id, chat_id: selectedChatId, target_id: targetId }) 
            });
            loadData();
        }

        async function memberAction(actionType) {
            const target = document.getElementById('memberTargetInput').value.trim();
            if (!target) return alert("Hedef girin!");
            if (!selectedChatId) return alert("Grup seçin!");
            const res = await fetch('/api/member/action', { 
                method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ user_id: user.id, target: target, action: actionType, chat_id: selectedChatId }) 
            });
            const data = await res.json();
            if (data.success) { alert(`✅ İşlem tamamlandı`); document.getElementById('memberTargetInput').value = ''; loadData(); } 
            else { alert("❌ Hata!"); }
        }

        function handleKatyaKey(e) { if (e.key === 'Enter') sendKatyaCommand(); }

        function sendKatyaCommand() {
            const input = document.getElementById('katyaInput');
            const text = input.value.trim();
            if (!text) return;
            const screen = document.getElementById('katyaScreen');
            screen.innerHTML += `<div class="j-msg user">${text}</div>`;
            input.value = '';
            screen.scrollTop = screen.scrollHeight;
            setTimeout(() => {
                let reply = "⚜️ 3D Perspektif kokpit panelleri aktif, Kraljica.";
                if (text.toLowerCase().includes('rapor')) reply = "📊 Sistemler tam güçte.";
                screen.innerHTML += `<div class="j-msg ai">${reply}</div>`;
                screen.scrollTop = screen.scrollHeight;
            }, 400);
        }

        verifyAccess();
    </script>
</body>
</html>
